<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pecox Voice Note</title>
<style>
 body{font-family:Arial,sans-serif;background:#f3f5f7;margin:0;padding:20px;text-align:center}
 select{padding:8px 12px;font-size:15px;border-radius:8px;border:1px solid #cbd5e1;margin-bottom:14px}
 button{width:130px;height:130px;border-radius:50%;border:none;background:#2563eb;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
 button.rec{background:#dc2626;animation:p 1.2s infinite}
 @keyframes p{50%{box-shadow:0 0 0 16px rgba(220,38,38,0)}}
 #s{margin-top:14px;font-size:13px;color:#475569}
 #t{margin-top:12px;min-height:60px;max-height:120px;overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px;font-size:14px;text-align:left}
</style></head><body>
<h3>Visit remarks voice note</h3>
<div>Language you will speak:<br>
<select id="lang">
 <option value="hi-IN">Hindi</option><option value="en-IN">English (India)</option>
 <option value="pa-IN">Punjabi</option><option value="gu-IN">Gujarati</option>
 <option value="mr-IN">Marathi</option><option value="bn-IN">Bengali</option>
 <option value="ta-IN">Tamil</option><option value="te-IN">Telugu</option>
</select></div>
<button id="b" onclick="toggle()">Tap to speak</button>
<div id="s">Speak as long as you need. Tap Stop when finished.</div>
<div id="t"></div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const s=m=>document.getElementById('s').textContent=m;
let r=null,active=false,finalText='';
if(!SR){s('This browser has no speech recognition. Use Google Chrome.');}
function toggle(){
  if(!SR)return;
  if(active){active=false;b.className='';b.textContent='Tap to speak';r.stop();return;}
  finalText='';t.textContent='';
  r=new SR();r.lang=lang.value;r.continuous=true;r.interimResults=true;
  r.onresult=e=>{let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const x=e.results[i][0].transcript;
      if(e.results[i].isFinal)finalText+=x+' ';else interim+=x;}
    t.textContent=finalText+interim;};
  r.onerror=e=>{ if(e.error!=='no-speech'&&e.error!=='aborted') s('Error: '+e.error); };
  r.onend=()=>{ if(active){try{r.start();}catch(e){}} else send(); };
  active=true;r.start();
  b.className='rec';b.textContent='Stop';s('Listening... speak now');
}
function send(){
  const text=(finalText||t.textContent).trim();
  if(!text){s('No speech heard. Try again.');return;}
  if(!window.opener){s('Lost connection to the app. Close this window and try again.');return;}
  window.opener.postMessage({type:'pq-voice-text',text:text,lang:lang.value},'*');
  s('Sent. You can close this window.');setTimeout(()=>window.close(),600);
}
</script></body></html>
